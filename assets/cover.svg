<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1680 768" width="100%" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Kimi SEO - animated cover: wordmark, a Kimi-style ask bar typing /kimi-seo:seo commands, and a line-art globe ringed with SEO questions"
     font-family="Inter, system-ui, sans-serif">
  <title>Kimi SEO</title>
  <desc>Deep dark banner with a starfield and dot grid. A kimi seo wordmark over a glowing Kimi-style ask bar that types example commands, beside a minimal line-art globe with orbiting SEO question pills.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .wordmark {
        font-family: 'JetBrains Mono', 'Cascadia Mono', monospace;
        font-size: 116px;
        font-weight: 700;
      }
      .tagline {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 21px;
        font-weight: 500;
        fill: #8b8b98;
        letter-spacing: 0.3px;
      }
      .prefix {
        font-family: 'JetBrains Mono', 'Cascadia Mono', monospace;
        font-size: 27px;
        font-weight: 600;
        fill: #5ea2f7;
      }
      .command {
        font-family: 'JetBrains Mono', 'Cascadia Mono', monospace;
        font-size: 27px;
        font-weight: 500;
        fill: #ececf1;
      }
      .chip {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 16px;
        font-weight: 600;
        fill: #9ecbff;
      }
      .pill-txt {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 15px;
        font-weight: 600;
        fill: #9ecbff;
      }
    ]]></style>

    <!-- palette: #9ecbff #7ab8ff #5ea2f7 #2f6bc0 on #101014 -->
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ecbff"/>
      <stop offset="45%" stop-color="#5ea2f7"/>
      <stop offset="100%" stop-color="#2f6bc0"/>
      <animate attributeName="x1" values="0;-0.55;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.45;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sendGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ab8ff"/>
      <stop offset="100%" stop-color="#2f6bc0"/>
    </linearGradient>

    <linearGradient id="fieldFill" x1="0" y1="400" x2="0" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191920"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>

    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ea2f7" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#5ea2f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5ea2f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9ecbff" stop-opacity="0.5"/><stop offset="100%" stop-color="#9ecbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ea2f7" stop-opacity="0.45"/><stop offset="100%" stop-color="#5ea2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6bc0" stop-opacity="0.5"/><stop offset="100%" stop-color="#2f6bc0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="scrim" cx="26%" cy="48%" r="120%">
      <stop offset="0%" stop-color="#0a0a0c" stop-opacity="0.66"/>
      <stop offset="44%" stop-color="#0a0a0c" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0.16"/>
    </radialGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#5ea2f7" stop-opacity="0"/>
      <stop offset="90%" stop-color="#5ea2f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5ea2f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="globeFill" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#5ea2f7" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#2f6bc0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#101014" stop-opacity="0.0"/>
    </radialGradient>

    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5ea2f7" opacity="0.10"/>
    </pattern>

    <filter id="barGlow" x="-20%" y="-120%" width="140%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="auroraBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="60"/></filter>

    <!-- typewriter clips: one per command, 20s cycle, 4s window each -->
    <clipPath id="tc0"><rect x="489" y="412" width="0" height="64">
      <animate attributeName="width" values="0;0;290;290;0;0" keyTimes="0;0;0.09;0.17;0.185;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="tc1"><rect x="489" y="412" width="0" height="64">
      <animate attributeName="width" values="0;0;306;306;0;0" keyTimes="0;0.2;0.29;0.37;0.385;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="tc2"><rect x="489" y="412" width="0" height="64">
      <animate attributeName="width" values="0;0;255;255;0;0" keyTimes="0;0.4;0.49;0.57;0.585;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="tc3"><rect x="489" y="412" width="0" height="64">
      <animate attributeName="width" values="0;0;340;340;0;0" keyTimes="0;0.6;0.69;0.77;0.785;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="tc4"><rect x="489" y="412" width="0" height="64">
      <animate attributeName="width" values="0;0;357;357;0;0" keyTimes="0;0.8;0.89;0.97;0.985;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- background -->
  <rect width="1680" height="768" fill="#101014"/>
  <rect width="1680" height="768" fill="url(#dots)"/>

  <!-- aurora drift -->
  <g filter="url(#auroraBlur)" opacity="0.9">
    <ellipse cx="480" cy="240" rx="520" ry="360" fill="url(#auA)">
      <animateTransform attributeName="transform" type="translate" values="0 0;70 36;0 0" dur="26s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1180" cy="560" rx="600" ry="380" fill="url(#auB)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-54 -24;0 0" dur="31s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="840" cy="660" rx="480" ry="320" fill="url(#auC)">
      <animateTransform attributeName="transform" type="translate" values="0 0;34 -42;0 0" dur="35s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- starfield -->
  <g fill="#9ecbff">
    <circle cx="120" cy="120" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.8s" begin="-0.4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="80" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5.1s" begin="-2.1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="140" r="1.9"><animate attributeName="opacity" values="0.1;0.85;0.1" dur="4.4s" begin="-1.3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="70" r="1.3"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="6.0s" begin="-3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="150" r="1.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.9s" begin="-0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1560" cy="90" r="1.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" begin="-1.7s" repeatCount="indefinite"/></circle>
    <circle cx="1460" cy="640" r="1.4"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.6s" begin="-2.8s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="640" r="1.7"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="4.1s" begin="-0.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="700" r="1.3"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.3s" begin="-3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1240" cy="700" r="1.5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.6s" begin="-1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- readability scrim -->
  <rect width="1680" height="768" fill="url(#scrim)"/>

  <!-- hero glow behind the ask bar -->
  <ellipse cx="560" cy="444" rx="480" ry="180" fill="url(#heroGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- wordmark + tagline -->
  <text x="180" y="312" class="wordmark" fill="url(#markGrad)"
        textLength="560" lengthAdjust="spacingAndGlyphs">kimi seo</text>
  <text x="184" y="360" class="tagline">full-site SEO audits, from a single command</text>

  <!-- ask bar glow -->
  <rect x="166" y="386" width="788" height="116" rx="58"
        fill="none" stroke="#5ea2f7" stroke-width="2" opacity="0.16" filter="url(#barGlow)">
    <animate attributeName="opacity" values="0.12;0.30;0.12" dur="4.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ask bar -->
  <rect x="180" y="400" width="760" height="88" rx="44"
        fill="url(#fieldFill)" stroke="#5ea2f7" stroke-opacity="0.38" stroke-width="1.2"/>

  <!-- magnifier -->
  <g fill="none" stroke="#8b8b98" stroke-width="2.4" stroke-linecap="round">
    <circle cx="228" cy="440" r="10"/>
    <line x1="236" y1="448" x2="244" y2="456"/>
  </g>

  <!-- static prefix + typed command -->
  <text x="262" y="452" class="prefix">/kimi-seo:seo</text>
  <g clip-path="url(#tc0)"><text x="489" y="452" class="command">audit example.com</text></g>
  <g clip-path="url(#tc1)"><text x="489" y="452" class="command">schema example.com</text></g>
  <g clip-path="url(#tc2)"><text x="489" y="452" class="command">geo my homepage</text></g>
  <g clip-path="url(#tc3)"><text x="489" y="452" class="command">content-brief ai seo</text></g>
  <g clip-path="url(#tc4)"><text x="489" y="452" class="command">drift compare my site</text></g>

  <!-- cursors: windowed visibility, follow the typing, blink -->
  <g fill="#5ea2f7">
    <g>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.17;0.185;1" dur="20s" repeatCount="indefinite"/>
      <rect x="489" y="424" width="3" height="36" rx="1">
        <animate attributeName="x" values="489;489;779;779;489;489" keyTimes="0;0;0.09;0.17;0.185;1" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.06s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.199;0.2;0.37;0.385;1" dur="20s" repeatCount="indefinite"/>
      <rect x="489" y="424" width="3" height="36" rx="1">
        <animate attributeName="x" values="489;489;795;795;489;489" keyTimes="0;0.2;0.29;0.37;0.385;1" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.06s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.399;0.4;0.57;0.585;1" dur="20s" repeatCount="indefinite"/>
      <rect x="489" y="424" width="3" height="36" rx="1">
        <animate attributeName="x" values="489;489;744;744;489;489" keyTimes="0;0.4;0.49;0.57;0.585;1" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.06s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.599;0.6;0.77;0.785;1" dur="20s" repeatCount="indefinite"/>
      <rect x="489" y="424" width="3" height="36" rx="1">
        <animate attributeName="x" values="489;489;829;829;489;489" keyTimes="0;0.6;0.69;0.77;0.785;1" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.06s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.799;0.8;0.97;0.985;1" dur="20s" repeatCount="indefinite"/>
      <rect x="489" y="424" width="3" height="36" rx="1">
        <animate attributeName="x" values="489;489;846;846;489;489" keyTimes="0;0.8;0.89;0.97;0.985;1" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.06s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- send button -->
  <circle cx="896" cy="444" r="26" fill="url(#sendGrad)">
    <animate attributeName="r" values="26;27.5;26" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M896 455 L896 433 M886 443 L896 433 L906 443" fill="none" stroke="#ffffff"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- suggestion chips -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4.6s" repeatCount="indefinite"/>
    <rect x="180" y="540" width="117" height="40" rx="20" fill="#17171d" fill-opacity="0.85" stroke="#5ea2f7" stroke-opacity="0.28"/>
    <text x="238" y="566" text-anchor="middle" class="chip">technical</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5.2s" begin="-1.2s" repeatCount="indefinite"/>
    <rect x="317" y="540" width="180" height="40" rx="20" fill="#17171d" fill-opacity="0.85" stroke="#5ea2f7" stroke-opacity="0.28"/>
    <text x="407" y="566" text-anchor="middle" class="chip">sitemap generate</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4.9s" begin="-2.3s" repeatCount="indefinite"/>
    <rect x="517" y="540" width="207" height="40" rx="20" fill="#17171d" fill-opacity="0.85" stroke="#5ea2f7" stroke-opacity="0.28"/>
    <text x="620" y="566" text-anchor="middle" class="chip">backlinks rival.com</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5.5s" begin="-3.1s" repeatCount="indefinite"/>
    <rect x="744" y="540" width="171" height="40" rx="20" fill="#17171d" fill-opacity="0.85" stroke="#5ea2f7" stroke-opacity="0.28"/>
    <text x="829" y="566" text-anchor="middle" class="chip">images optimize</text>
  </g>

  <!-- line-art globe -->
  <circle cx="1300" cy="370" r="336" fill="url(#halo)"/>
  <circle cx="1300" cy="370" r="300" fill="none" stroke="#5ea2f7" stroke-opacity="0.30"
          stroke-width="1.4" stroke-dasharray="2 14">
    <animateTransform attributeName="transform" type="rotate" from="0 1300 370" to="360 1300 370" dur="60s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 1300 370" to="360 1300 370" dur="24s" repeatCount="indefinite"/>
    <circle cx="1300" cy="70" r="5" fill="#7ab8ff"/>
    <circle cx="1560" cy="500" r="4" fill="#5ea2f7"/>
    <circle cx="1040" cy="500" r="4" fill="#9ecbff"/>
  </g>
  <circle cx="1300" cy="370" r="240" fill="url(#globeFill)" stroke="#5ea2f7" stroke-opacity="0.55" stroke-width="1.6"/>
  <ellipse cx="1300" cy="370" rx="240" ry="240" fill="none" stroke="#2f6bc0" stroke-opacity="0.55" stroke-width="1.2">
    <animate attributeName="rx" values="240;0;240" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.55;0.12;0.55" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1300" cy="370" rx="160" ry="240" fill="none" stroke="#2f6bc0" stroke-opacity="0.55" stroke-width="1.2">
    <animate attributeName="rx" values="160;0;160" keyTimes="0;0.5;1" dur="9s" begin="-3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.55;0.12;0.55" keyTimes="0;0.5;1" dur="9s" begin="-3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1300" cy="370" rx="80" ry="240" fill="none" stroke="#2f6bc0" stroke-opacity="0.55" stroke-width="1.2">
    <animate attributeName="rx" values="80;0;80" keyTimes="0;0.5;1" dur="9s" begin="-6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.55;0.12;0.55" keyTimes="0;0.5;1" dur="9s" begin="-6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1300" cy="290" rx="226" ry="42" fill="none" stroke="#2f6bc0" stroke-opacity="0.4" stroke-width="1.1"/>
  <ellipse cx="1300" cy="450" rx="226" ry="42" fill="none" stroke="#2f6bc0" stroke-opacity="0.4" stroke-width="1.1"/>
  <line x1="1060" y1="370" x2="1540" y2="370" stroke="#2f6bc0" stroke-opacity="0.4" stroke-width="1.1"/>

  <!-- SEO question pills -->
  <g transform="translate(1300 96)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.25;0.286;1" dur="12s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -4;0 0" dur="3.4s" repeatCount="indefinite"/><g transform="rotate(2)"><rect x="-76" y="-18" width="152" height="36" rx="18" fill="#101014" fill-opacity="0.78" stroke="#5ea2f7" stroke-opacity="0.45"/><text x="0" y="5" text-anchor="middle" class="pill-txt">how to rank #1?</text></g></g>
  <g transform="translate(1036 246)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.25;0.286;1" dur="12s" begin="-2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -4;0 0" dur="3.8s" repeatCount="indefinite"/><g transform="rotate(-4)"><rect x="-82" y="-18" width="164" height="36" rx="18" fill="#101014" fill-opacity="0.78" stroke="#5ea2f7" stroke-opacity="0.45"/><text x="0" y="5" text-anchor="middle" class="pill-txt">what is E-E-A-T?</text></g></g>
  <g transform="translate(1566 262)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.25;0.286;1" dur="12s" begin="-4.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -4;0 0" dur="4.2s" repeatCount="indefinite"/><g transform="rotate(4)"><rect x="-76" y="-18" width="152" height="36" rx="18" fill="#101014" fill-opacity="0.78" stroke="#5ea2f7" stroke-opacity="0.45"/><text x="0" y="5" text-anchor="middle" class="pill-txt">build backlinks?</text></g></g>
  <g transform="translate(1058 514)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.25;0.286;1" dur="12s" begin="-7.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -4;0 0" dur="3.6s" repeatCount="indefinite"/><g transform="rotate(-3)"><rect x="-76" y="-18" width="152" height="36" rx="18" fill="#101014" fill-opacity="0.78" stroke="#5ea2f7" stroke-opacity="0.45"/><text x="0" y="5" text-anchor="middle" class="pill-txt">LCP under 2.5s</text></g></g>
  <g transform="translate(1548 508)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.25;0.286;1" dur="12s" begin="-9.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -4;0 0" dur="4.0s" repeatCount="indefinite"/><g transform="rotate(3)"><rect x="-72" y="-18" width="144" height="36" rx="18" fill="#101014" fill-opacity="0.78" stroke="#5ea2f7" stroke-opacity="0.45"/><text x="0" y="5" text-anchor="middle" class="pill-txt">schema for AI?</text></g></g>
</svg>
