[project]
name = "kimi-seo"
version = "2.2.4"
description = "Comprehensive SEO analysis skill for Kimi Code"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
  {name = "Daniel Agrici"}
]
keywords = ["seo", "kimi-code", "ai-tools", "schema-markup", "e-e-a-t", "geo"]

[project.urls]
Homepage = "https://github.com/bentocodeing/kimi-seo"
Repository = "https://github.com/bentocodeing/kimi-seo"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
